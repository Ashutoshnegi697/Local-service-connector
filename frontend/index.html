<title>Yogya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@600&display=swap">
<style>
/* Layout: auth is a brand panel beside a form card; the app is a sticky top bar, a scrolling tab row and one content column. Sheets (SMS inbox, checkout) slide over the page. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E8EDE6; --ink:#10211D; --muted:#566660; --line:#D3DBD1;
  --brand:#14614F; --brand-ink:#FFFFFF; --brand-soft:#DCEBE5; --accent:#D98E04; --accent-soft:#FBEFD2;
  --good:#1E7A46; --good-soft:#DDF0E3; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B3261E; --bad-soft:#F8DEDB;
  --chip-on-brand:rgba(255,255,255,.16); --shadow:0 1px 2px rgba(16,33,29,.06),0 8px 22px rgba(16,33,29,.07);
  --scrim:rgba(8,16,14,.55);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --font-deva:'Noto Sans Devanagari','Nirmala UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513; --surface:#132220; --surface-2:#1B2D2A; --ink:#E6EEEA; --muted:#93A8A0; --line:#27403B;
    --brand:#4CC2A0; --brand-ink:#04201A; --brand-soft:#173B33; --accent:#F0B340; --accent-soft:#3A2D10;
    --good:#58C98A; --good-soft:#163A27; --warn:#F0B340; --warn-soft:#3A2D10; --bad:#FF8A80; --bad-soft:#40201E;
    --chip-on-brand:rgba(0,0,0,.14); --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#132220; --surface-2:#1B2D2A; --ink:#E6EEEA; --muted:#93A8A0; --line:#27403B;
  --brand:#4CC2A0; --brand-ink:#04201A; --brand-soft:#173B33; --accent:#F0B340; --accent-soft:#3A2D10;
  --good:#58C98A; --good-soft:#163A27; --warn:#F0B340; --warn-soft:#3A2D10; --bad:#FF8A80; --bad-soft:#40201E;
  --chip-on-brand:rgba(0,0,0,.14); --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:25px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1040px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:18px;height:18px}

/* brand mark */
.mark{display:flex;align-items:baseline;gap:8px}
.mark .deva{font-family:var(--font-deva);font-weight:600;font-size:22px;color:var(--brand)}
.mark .latin{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.btn.danger-text{color:var(--bad)}
.btn.block{width:100%}
.btn.icon{width:40px;padding:0;position:relative}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link[disabled]{opacity:.55;cursor:not-allowed;text-decoration:none}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--accent);color:#1b1300;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* forms */
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field .hint{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
input.otp{font-family:var(--font-display);font-size:26px;letter-spacing:.45em;text-align:center;font-weight:700;min-height:54px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.form-error{color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}

/* auth */
.authbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 0}
.authbar .row{gap:8px}
.auth{display:grid;gap:16px;padding-block:14px 8px}
.brandpanel{position:relative;overflow:hidden;background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:28px;display:grid;gap:20px;align-content:start}
.brandpanel>*{position:relative}
.brandpanel .rangoli{position:absolute;right:-90px;bottom:-90px;width:380px;height:380px;opacity:.17;color:var(--brand-ink)}
.brandpanel .deva{font-family:var(--font-deva);font-weight:600;font-size:clamp(44px,9vw,68px);line-height:1}
.brandpanel .latin{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.02em;opacity:.85}
.brandpanel h1{font-size:clamp(26px,4vw,36px);font-weight:700}
.brandpanel p{opacity:.92;max-width:44ch}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--chip-on-brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.cloud{display:flex;flex-wrap:wrap;gap:6px}
.cloud span{background:var(--chip-on-brand);border-radius:99px;padding:3px 11px;font-size:13px}
.cloudlabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.authpanel{display:grid;gap:14px;align-content:start}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);display:grid;gap:16px}
.demo{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:14px}
@media (min-width:880px){.auth{grid-template-columns:5fr 6fr;gap:24px;padding-block:20px 28px}.brandpanel{padding:40px}}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.topbar .who div{min-width:0;line-height:1.25}
.topbar .who strong,.topbar .who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24ch}
@media (max-width:640px){.topbar .who div,.topbar .avatar{display:none}}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.avatar.lg{width:46px;height:46px;font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:14px;scrollbar-width:thin}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:99px;padding:8px 15px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);font-weight:700}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#1b1300;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.content{display:grid;gap:20px;padding-block:6px 0}
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:end;justify-content:space-between}
.head p{color:var(--muted);max-width:60ch}
.hello{position:relative;overflow:hidden;background:var(--brand-soft);border-radius:22px;padding:22px 24px;display:grid;gap:6px}
.hello>*{position:relative}
.hello .rangoli{position:absolute;right:-60px;top:-70px;width:260px;height:260px;color:var(--brand);opacity:.16}
.hello h2{font-size:28px}
.hello p{color:var(--muted)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.next{border-color:var(--brand);box-shadow:var(--shadow)}
.list{display:grid;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.item{display:grid;gap:12px}
.item .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.item .who{display:flex;align-items:center;gap:12px;min-width:0}
.item .who div{min-width:0}
.item .who strong{display:block;overflow-wrap:anywhere}
.svc{display:flex;align-items:center;gap:10px;min-width:0}
.svc .bub{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px}
.meta b{color:var(--ink);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--font-display);font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.empty strong{color:var(--ink);font-family:var(--font-display);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:500}
.pick:hover{border-color:var(--brand)}
.pick[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{display:grid;justify-items:center;gap:8px;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-align:center;font-size:14px}
.tile .ico{width:26px;height:26px;color:var(--brand)}
.tile:hover{border-color:var(--brand)}
.tile[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.tile[aria-pressed="true"] .ico{color:var(--brand-ink)}
.tag{display:inline-flex;align-items:center;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted)}
.tag.WAITING,.tag.PENDING{background:var(--warn-soft);color:var(--warn)}
.tag.ACCEPTED{background:var(--brand-soft);color:var(--brand)}
.tag.COMPLETED{background:var(--good-soft);color:var(--good)}
.tag.CANCELLED,.tag.REJECTED,.tag.DECLINED{background:var(--bad-soft);color:var(--bad)}
.stars{color:var(--accent);letter-spacing:1px}
.track{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.track i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.track i.on{background:var(--brand)}
.track s{width:22px;height:2px;background:var(--line);text-decoration:none;display:inline-block}
.track s.on{background:var(--brand)}
.track em{font-style:normal}
.track em.on{color:var(--ink);font-weight:700}
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.codebox b{font-family:var(--font-display);font-size:26px;letter-spacing:.2em;line-height:1}
.codebox span{font-size:13px;font-weight:700}
.codebox small{flex-basis:100%;color:var(--muted)}
.starpick{display:flex;gap:4px}
.starpick button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--line);cursor:pointer}
.starpick button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.svcsum{display:flex;flex-wrap:wrap;gap:8px}
.svcsum span{background:var(--good-soft);color:var(--good);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.price{font-family:var(--font-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.inline .field{flex:1 1 160px}

/* toasts and SMS banners */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);padding:0 16px;display:grid;gap:8px;justify-items:center;pointer-events:none;z-index:40}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;max-width:min(92vw,460px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.toast.bad{background:var(--bad);color:#fff}
.smsbanner{pointer-events:auto;width:min(92vw,440px);text-align:left;display:grid;gap:2px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:pointer}
.smsbanner b{font-size:12px;letter-spacing:.06em;color:var(--brand);display:flex;justify-content:space-between}
.smsbanner span{font-size:14px}

/* sheets */
.overlay{position:fixed;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);width:min(100%,470px);max-height:calc(100% - 8px);overflow:auto;border-radius:22px;padding:22px;display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet:focus{outline:none}
@media (max-width:560px){.overlay{place-items:end center;padding-bottom:0}.sheet{border-radius:22px 22px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sms{background:var(--surface-2);border-radius:16px 16px 16px 4px;padding:10px 14px;display:grid;gap:4px}
.sms.new{background:var(--brand-soft)}
.sms .sm{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.sms .sm b{color:var(--brand);letter-spacing:.05em}
.sms p{font-size:14px;overflow-wrap:anywhere}
.payhead{display:flex;align-items:center;justify-content:space-between}
.amount{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);margin:6px auto}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  .toast,.smsbanner{animation:dn .22s ease-out}@keyframes dn{from{transform:translateY(-10px);opacity:0}}
  .sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}
  .card,.tile,.btn{transition:border-color .15s,box-shadow .15s,transform .15s}
  .cols>.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
}
.okmark{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto}
.okmark.bad{background:var(--bad-soft);color:var(--bad)}
.okmark .ico{width:30px;height:30px;stroke-width:2.4}
.center{text-align:center;display:grid;gap:8px;justify-items:center}
</style>

<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
(function(){
'use strict';
const SERVICES=['Plumber','Carpenter','Electrician','Geyser Repair','AC Repair','Painter','Cleaner','Appliance Repair','Vegetable Vendor'];
const AREAS=['Rishikesh','Raipur','Dehradun','Clement Town','Prem Nagar'];
const CATS=['Coding & Tech','Dance','Music','Art & Craft','Languages','Sports & Fitness','Academics','Cooking','Business & Finance','Other'];
const LEVELS=['Beginners','Intermediate','Advanced','All levels'];
const FEES={'Plumber':350,'Carpenter':400,'Electrician':300,'Geyser Repair':450,'AC Repair':600,'Painter':500,'Cleaner':450,'Appliance Repair':400,'Vegetable Vendor':40};
const MAXQ=5, KEY='yogya-state-v2';
const IC={
  'Plumber':'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7V21h3.3l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  'Carpenter':'<path d="M3 17l14-10 4 4-14 10zM8 14l2 2M11 12l2 2M14 10l2 2"/>',
  'Electrician':'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  'Geyser Repair':'<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>',
  'AC Repair':'<path d="M12 2v20M4.2 7l15.6 10M19.8 7L4.2 17M9 3l3 2 3-2M9 21l3-2 3 2"/>',
  'Painter':'<path d="M18 3l3 3-9 9-3-3zM9 12l-3 1c-2 1-1 5-4 6 4 1 8 0 8-4z"/>',
  'Cleaner':'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
  'Appliance Repair':'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/>',
  'Vegetable Vendor':'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l8-8"/>',
  'bell':'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 0 0 4 0"/>',
  'chat':'<path d="M4 5h16v11H9l-5 4z"/>',
  'moon':'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  'check':'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  'x':'<path d="M6 6l12 12M18 6L6 18"/>'
};
function icon(n,c){return `<svg class="ico ${c||''}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||IC['Plumber']}</svg>`}
function rangoli(){let s='';for(let i=0;i<12;i++)s+=`<ellipse cx="160" cy="80" rx="22" ry="62" transform="rotate(${i*30} 160 160)"/>`;for(let r=20;r<=150;r+=26)s+=`<circle cx="160" cy="160" r="${r}"/>`;return `<svg class="rangoli" viewBox="0 0 320 320" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">${s}</svg>`}

/* ---------- data ---------- */

/* ---------- OTP (6 digits, 5 minutes, 3 tries, resend after 30 seconds) ---------- */
let otp=null;
function newOtp(phone){
  const code=String(Math.floor(100000+Math.random()*900000));
  otp={phone,code,exp:Date.now()+300000,tries:0,sentAt:Date.now()};
  sms(phone,code+' is your Yogya verification code. It is valid for 5 minutes. Never share it with anyone.');
}
function checkOtp(v){
  if(!otp)return 'Request a new code first.';
  if(Date.now()>otp.exp)return 'This code has expired. Request a new one.';
  if(otp.tries>=3)return 'Too many wrong attempts. Request a new code.';
  if(String(v).trim()!==otp.code){otp.tries++;const left=3-otp.tries;return left>0?'That code is not correct. '+left+' attempt'+(left>1?'s':'')+' left.':'Too many wrong attempts. Request a new code.'}
  return '';
}

    if(q){const o=acct(t.ownerRole,t.ownerId);if((t.skill+' '+t.bio+' '+t.category+' '+(o?o.name:'')).toLowerCase().indexOf(q)<0)return false}
    return true;
  }).sort((a,b)=>b.created-a.created);

function paySheet(){

  const head=`<div class="sheethead"><h3 id="sh-t" style="font-size:19px">Yogya Pay <span class="tag" style="vertical-align:middle">DEMO MODE</span></h3>${m.step==='processing'?'':`<button class="btn icon ghost" data-act="closemodal" aria-label="Close">${icon('x')}</button>`}</div>`;
  const sum=`<div><div class="amount">${inr(x.amount)}</div><div class="muted small">${esc(pt.label)} · to ${esc(pt.payee?pt.payee.name:'')}</div></div>`;
  const foot='<p class="muted small">Test checkout. No real money moves and no real UPI request is sent.</p>';
  let body='';
  if(m.step==='method'){
    const upi=m.method==='upi';
    body=`${sum}<div class="seg" role="group" aria-label="Payment method"><button data-act="paymethod" data-v="upi" aria-pressed="${upi}">UPI</button><button data-act="paymethod" data-v="cash" aria-pressed="${!upi}">Cash after service</button></div>
    ${upi?`<form data-form="payupi" novalidate class="stack"><div class="field"><label for="upi">UPI ID</label><input id="upi" name="upi" value="${esc(m.upi||'')}" placeholder="name@upi" autocomplete="off" autocapitalize="none"><span class="hint">Any ID in the form name@bank works in demo mode.</span></div><p class="form-error" role="alert" hidden></p><button class="btn primary block">Pay ${inr(x.amount)}</button></form>`
    :`<div class="stack"><p>You will hand ${inr(x.amount)} in cash to ${esc(pt.payee?first(pt.payee.name):'the provider')} after the service. They confirm it in Yogya.</p><button class="btn primary block" data-act="paycash">Choose cash</button></div>`}${foot}`;
  }else if(m.step==='processing'){
    body=`${sum}<div class="center" role="status"><div class="spin"></div><strong>Sending request to ${esc(m.upi)}</strong><span class="muted small">Waiting for your UPI app</span></div>`;
  }else if(m.step==='approve'){
    body=`${sum}<div class="stack"><p>A collect request for ${inr(x.amount)} was sent to <b>${esc(m.upi)}</b>. In a real app you would approve it in your UPI app. Pick an outcome to test:</p><div class="actions"><button class="btn primary" data-act="payapprove">Approve in UPI app</button><button class="btn" data-act="paydecline">Decline</button></div></div>${foot}`;
  }else if(m.step==='done'){
    body=`<div class="center"><div class="okmark">${icon('check')}</div><h3>Payment successful</h3><div class="amount">${inr(x.amount)}</div></div>
    <dl class="kv"><dt>Reference</dt><dd><b>${esc(x.pay&&x.pay.ref)}</b></dd><dt>Method</dt><dd>${esc(x.pay&&x.pay.method)}</dd><dt>Paid to</dt><dd>${esc(pt.payee?pt.payee.name:'')}</dd><dt>For</dt><dd>${esc(pt.label)}</dd><dt>Time</dt><dd>${x.pay?when(x.pay.ts):''}</dd></dl>
    <button class="btn primary block" data-act="closemodal">Done</button>`;
  }else if(m.step==='cashdone'){
    body=`<div class="center"><div class="okmark">${icon('check')}</div><h3>Cash payment noted</h3><p class="muted">Pay ${inr(x.amount)} in cash after the service. ${esc(pt.payee?first(pt.payee.name):'The provider')} confirms it in Yogya.</p></div><button class="btn primary block" data-act="closemodal">Done</button>`;
  }else{
    body=`<div class="center"><div class="okmark bad">${icon('x')}</div><h3>Payment declined</h3><p class="muted">No money was taken. You can try again or choose cash.</p></div><div class="actions"><button class="btn primary" data-act="payretry">Try again</button><button class="btn ghost" data-act="closemodal">Close</button></div>`;
  }
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" tabindex="-1">${(m.step==='done'||m.step==='cashdone'||m.step==='failed')?'':head}${body}</div>`;

/* ---------- rules ---------- */
function findAccount(r,ident){
  ident=String(ident).trim().toLowerCase();if(!ident)return null;
  return (r==='user'?DB.users:DB.providers).find(a=>String(a.id)===ident||a.phone===ident||a.email.toLowerCase()===ident)||null;
}
const same=(a,b)=>String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
function checkDetails(f,r,selfId){
  if(f.name.length<2)return 'Enter your full name.';
  if(!/^\d{10}$/.test(f.phone))return 'Mobile number must be 10 digits.';
  if(!/^\S+@\S+\.\S+$/.test(f.email))return 'Enter a valid email address.';
  const list=r==='user'?DB.users:DB.providers;
  if(list.some(a=>a.id!==selfId&&a.phone===f.phone))return 'That mobile number is already registered.';
  if(list.some(a=>a.id!==selfId&&a.email.toLowerCase()===f.email.toLowerCase()))return 'That email is already registered.';
  return '';
}
function checkFee(v){const n=Number(v);return (v!==''&&n>=0&&n<=100000)?Math.round(n):null}
function login(r,acc){
  DB.session={role:r,id:acc.id};ui.confirm=null;ui.reqOpen=null;ui.trainTab='find';ui.step='form';ui.ctx=null;otp=null;ui.tab='home';
  ui.book={service:'Plumber',area:r==='user'?acc.area:'Dehradun',sort:'current'};
}
function startOtp(purpose,r,phone,extra){
  ui.ctx=Object.assign({purpose,role:r,phone},extra||{});ui.step='otp';newOtp(phone);render();
}

const F={
  signin(form,fd){
    const r=ui.authRole,acc=findAccount(r,fd.get('ident'));
    if(!acc)return formErr(form,(r==='user'?'User':'Provider')+' ID, phone or email not found.');
    if(fd.get('password')!==acc.password)return formErr(form,'Incorrect password. Try "SMS code" or "Forgot password?".');
    login(r,acc);commit();toast('Welcome, '+acc.name+'!');
  },
  signinotp(form,fd){
    const r=ui.authRole,acc=findAccount(r,fd.get('ident'));
    if(!acc)return formErr(form,(r==='user'?'User':'Provider')+' ID, phone or email not found.');
    startOtp('login',r,acc.phone,{accId:acc.id});
  },
  resetotp(form,fd){
    const r=ui.authRole,acc=findAccount(r,fd.get('ident'));
    if(!acc)return formErr(form,'No account found for that ID, phone or email.');
    startOtp('reset',r,acc.phone,{accId:acc.id});
  },
  recover(form,fd){
    const acc=findAccount(ui.authRole,fd.get('ident'));
    if(!acc)return formErr(form,'No account found for that ID, phone or email.');
    if(!same(fd.get('friend'),acc.friend)||!same(fd.get('mail'),acc.mail))return formErr(form,'Security answers do not match.');
    if(String(fd.get('password')).length<6)return formErr(form,'New password must be at least 6 characters.');
    acc.password=fd.get('password');ui.authMode='signin';commit();toast('Password changed. Sign in with your new password.');
  },
  signup(form,fd){
    const r=ui.authRole,f={name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).replace(/\s/g,''),email:String(fd.get('email')).trim()};
    let err=checkDetails(f,r,0);if(err)return formErr(form,err);
    if(String(fd.get('password')).length<6)return formErr(form,'Password must be at least 6 characters.');
    const friend=String(fd.get('friend')).trim(),mail=String(fd.get('mail')).trim();
    if(!friend||!mail)return formErr(form,'Answer both security questions.');
    const acc={name:f.name,phone:f.phone,email:f.email,password:fd.get('password'),area:fd.get('area'),friend,mail};
    if(r==='provider'){const fee=checkFee(fd.get('fee'));if(fee===null)return formErr(form,'Enter a starting charge between 0 and 100000.');acc.service=fd.get('service');acc.fee=fee;acc.ratingTotal=0;acc.ratingCount=0;acc.workCount=0}
    startOtp('signup',r,f.phone,{acc});
  },
  verify(form,fd){
    const c=ui.ctx;if(!c)return;
    if(c.purpose==='reset'&&String(fd.get('password')).length<6)return formErr(form,'New password must be at least 6 characters.');
    const err=checkOtp(fd.get('code'));if(err)return formErr(form,err);
    otp=null;
    if(c.purpose==='signup'){
      const acc=c.acc;
      if(c.role==='user'){acc.id=DB.nextUser++;DB.users.push(acc)}else{acc.id=DB.nextProv++;DB.providers.push(acc)}
      login(c.role,acc);commit();toast('Phone verified. Your '+(c.role==='user'?'User':'Provider')+' ID is '+acc.id+'. Keep it for signing in.',false,7000);
    }else if(c.purpose==='login'){
      const acc=acct(c.role,c.accId);login(c.role,acc);commit();toast('Welcome, '+acc.name+'!');
    }else{
      const acc=acct(c.role,c.accId);acc.password=fd.get('password');ui.step='form';ui.ctx=null;ui.authMode='signin';commit();toast('Password changed. Sign in with your new password.');
    }
  },
  complete(form,fd){
    const p=me(),b=DB.bookings.find(x=>x.no===Number(form.dataset.no));if(!b||b.status!=='ACCEPTED')return;
    if(String(fd.get('code')).trim()!==b.code)return formErr(form,'That code does not match. Ask the customer for the code from their SMS.');
    b.status='COMPLETED';b.doneAt=Date.now();p.workCount++;
    if(b.pay&&b.pay.status==='CASH')b.pay={status:'PAID',method:'Cash',ref:'CASH'+b.no,ts:Date.now()};
    const u=acct('user',b.userId);
    if(u)sms(u.phone,`Your ${b.service} job #${b.no} was closed by ${p.name}. ${b.pay&&b.pay.status==='PAID'?'Thank you for paying.':'Amount due '+inr(b.amount)+'.'} Please rate your experience in Yogya.`);
    commit();toast('Job #'+b.no+' closed.');
  },
  payupi(form,fd){
    const v=String(fd.get('upi')).trim();ui.modal.upi=v;
    if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v))return formErr(form,'Enter a UPI ID like name@upi.');
    ui.modal.step='processing';renderModal();
    clearTimeout(ui.timer);ui.timer=setTimeout(()=>{if(ui.modal&&ui.modal.type==='pay'&&ui.modal.step==='processing'){ui.modal.step='approve';renderModal()}},1500);
  },
  request(form,fd){
    const id=Number(form.dataset.id),t=DB.trainers.find(x=>x.id===id),msg=String(fd.get('message')).trim();
    if(!t)return;if(msg.length<5)return formErr(form,'Write a short message so the trainer knows what you need.');
    DB.sessions.push({id:DB.nextSession++,listingId:t.id,skill:t.skill,trainerRole:t.ownerRole,trainerId:t.ownerId,learnerRole:role(),learnerId:me().id,message:msg,status:'PENDING',created:Date.now(),amount:t.fee,pay:null});
    const o=acct(t.ownerRole,t.ownerId);if(o)sms(o.phone,`${me().name} wants to learn ${t.skill} from you. Open Yogya > Trainers > Sessions to reply.`);
    ui.reqOpen=null;commit();toast('Request sent.');
  },
  teach(form,fd){
    const skill=String(fd.get('skill')).trim(),fee=checkFee(fd.get('fee')),bio=String(fd.get('bio')).trim(),mode=fd.get('mode');
    if(skill.length<2)return formErr(form,'Enter the skill you teach.');
    if(fee===null)return formErr(form,'Enter a fee between 0 and 100000.');
    if(bio.length<10)return formErr(form,'Describe your teaching in at least 10 characters.');
    DB.trainers.push({id:DB.nextTrainer++,ownerRole:role(),ownerId:me().id,skill,category:fd.get('category'),level:fd.get('level'),mode,area:mode==='Online'?'Anywhere (online)':fd.get('area'),fee,bio,created:Date.now()});
    commit();toast('Listing published. Learners can now find you.');
  },
  details(form,fd){
    const a=me(),r=role(),f={name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).replace(/\s/g,''),email:String(fd.get('email')).trim()};
    const err=checkDetails(f,r,a.id);if(err)return formErr(form,err);
    if(r==='provider'){const fee=checkFee(fd.get('fee'));if(fee===null)return formErr(form,'Enter a starting charge between 0 and 100000.');a.fee=fee;a.service=fd.get('service')}
    a.name=f.name;a.phone=f.phone;a.email=f.email;a.area=fd.get('area');
    commit();toast('Details saved.');
  },
  password(form,fd){
    const a=me();if(fd.get('old')!==a.password)return formErr(form,'Current password is incorrect.');
    if(String(fd.get('next')).length<6)return formErr(form,'New password must be at least 6 characters.');
    a.password=fd.get('next');commit();toast('Password changed.');
  },
  security(form,fd){
    const a=me();if(fd.get('old')!==a.password)return formErr(form,'Current password is incorrect.');
    const fr=String(fd.get('friend')).trim(),ml=String(fd.get('mail')).trim();if(!fr||!ml)return formErr(form,'Fill in both answers.');
    a.friend=fr;a.mail=ml;commit();toast('Security answers updated.');
  }
};

function recordPayment(kind,id,method,status){
  const x=getItem(kind,id);if(!x)return;const pt=parties(kind,x);
  if(status==='PAID'){
    x.pay={status:'PAID',method,ref:method==='Cash'?'CASH'+id:'YGP'+String(Math.floor(10000000+Math.random()*89999999)),ts:Date.now()};
    if(pt.payee)sms(pt.payee.phone,`You received ${inr(x.amount)} from ${pt.payer?pt.payer.name:'a customer'} for ${pt.label}. Ref ${x.pay.ref}.`);
    if(pt.payer)sms(pt.payer.phone,`Payment of ${inr(x.amount)} received for ${pt.label}. Ref ${x.pay.ref}. Thank you!`);
  }else x.pay={status:'CASH',method:'Cash',ts:Date.now()};
}

const A={
  authrole(el){ui.authRole=el.dataset.role;render()},

    const b={no:DB.nextBooking++,userId:u.id,providerId:p.id,service:p.service,area:p.area,status:'WAITING',created:Date.now(),seq:++DB.seq,rating:null,amount:p.fee,code:null,pay:null};
    DB.bookings.push(b);
    sms(u.phone,`Booking #${b.no} for ${b.service} was sent to ${p.name}. You will get an SMS when it is accepted.`);
    sms(p.phone,`New booking request #${b.no} from ${u.name} (${b.service}, ${b.area}). Open Yogya to accept or reject.`);

  },

  },
  star(el){ui.rate[el.dataset.no]=Number(el.dataset.n);render()},

  traintab(el){ui.trainTab=el.dataset.v;ui.tab='train';ui.reqOpen=null;ui.confirm=null;render()},

  },
  sess(el){

    s.status=el.dataset.v;

    if(s.status==='ACCEPTED'&&l)sms(l.phone,`${t?t.name:'The trainer'} accepted your ${s.skill} session request. Fee ${inr(s.amount)}. Open Yogya to pay.`);
    if(s.status==='DECLINED'&&l)sms(l.phone,`${t?t.name:'The trainer'} could not take your ${s.skill} request. Try another trainer.`);
    commit();toast(s.status==='ACCEPTED'?'Accepted. The learner can now see your phone number.':s.status==='DECLINED'?'Request declined.':'Request withdrawn.');
  },
  /* SMS and payment sheets */
  sms(){const a=me(),mine=(a&&!ui.smsAll)?DB.sms.filter(m=>m.to===a.phone):DB.sms;ui.modal={type:'sms',fresh:mine.filter(m=>!m.read).map(m=>m.id)};DB.sms.forEach(m=>{if(!a||m.to===a.phone)m.read=true});save();render()},
  smsscope(el){ui.smsAll=el.dataset.v==='all';const keep=ui.modal.fresh;ui.modal={type:'sms',fresh:keep};renderModal()},
  closemodal(){closeModal()},
  scrim(el,e){if(e.target===el&&!(ui.modal&&ui.modal.step==='processing'))closeModal()},
  pay(el){ui.modal={type:'pay',kind:el.dataset.kind,id:Number(el.dataset.id),step:'method',method:'upi',upi:''};renderModal()},
  paymethod(el){ui.modal.method=el.dataset.v;renderModal()},
  paycash(){const m=ui.modal;recordPayment(m.kind,m.id,'Cash','CASH');m.step='cashdone';save();render()},
  payapprove(){const m=ui.modal;recordPayment(m.kind,m.id,'UPI','PAID');m.step='done';save();render()},
  paydecline(){ui.modal.step='failed';renderModal()},
  payretry(){ui.modal.step='method';renderModal()},
  cashin(el){
    const x=getItem(el.dataset.kind,Number(el.dataset.id));if(!x)return;
    recordPayment(el.dataset.kind,Number(el.dataset.id),'Cash','PAID');commit();toast('Cash payment recorded.');
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.act==='scrim'&&e.target!==el)return;
  const f=A[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();
  const f=F[form.dataset.form];if(f){formErr(form,'');f(form,new FormData(form))}
});
document.addEventListener('input',e=>{
  if(e.target.id==='tq'){ui.filter.q=e.target.value;const r=$('#trainer-results');if(r)r.innerHTML=trainerResults()}
  if(e.target.id==='upi'&&ui.modal)ui.modal.upi=e.target.value;
});
document.addEventListener('change',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;
  if(b){ui.filter[b]=e.target.value;const r=$('#trainer-results');if(r)r.innerHTML=trainerResults()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal&&ui.modal.step!=='processing')closeModal()});

/* resend countdown */
setInterval(()=>{
  const b=$('#resend-btn');if(!b||!otp)return;
  const left=Math.ceil(30-(Date.now()-otp.sentAt)/1000);
  if(left>0){b.disabled=true;b.textContent='Resend code in '+left+'s'}else{b.disabled=false;b.textContent='Resend code'}
},1000);

render();
})();
</script>
